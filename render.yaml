services:
  - type: web
    name: first-image-studio-erp
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: studio-persistent-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: MAX_BACKUPS
        value: "30"
